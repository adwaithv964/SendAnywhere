<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d7dfe3">
  <meta name="description" content="Secure internet file and text transfer with AES-256-GCM encryption.">
  <title>Send</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <section class="cards" aria-label="Transfer">
      <div class="card send-card">
        <h1>Send</h1>
        <div class="send-tabs" role="tablist" aria-label="Send mode">
          <button class="send-tab active" id="tabFiles" role="tab" aria-selected="true" aria-controls="panelFiles">Files</button>
          <button class="send-tab" id="tabText" role="tab" aria-selected="false" aria-controls="panelText">Text</button>
        </div>
        <div id="panelFiles" role="tabpanel" aria-labelledby="tabFiles">
          <button class="plus" id="chooseFiles" aria-label="Choose files" title="Choose files">
            <span></span><span></span>
          </button>
          <input id="fileInput" type="file" multiple hidden>
        </div>
        <div id="panelText" role="tabpanel" aria-labelledby="tabText" class="hidden">
          <button class="text-send-btn" id="openTextSend" aria-label="Compose text" title="Compose and send text">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
        </div>
      </div>

      <div class="card receive-card">
        <h2>Receive</h2>
        <div class="key-row">
          <input id="keyInput" inputmode="numeric" maxlength="6" placeholder="Input key" aria-label="Input key">
          <button id="receiveBtn" class="download-button" aria-label="Receive" title="Receive">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <!-- ── File send modal ──────────────────────────────────────────────── -->
  <div class="modal hidden" id="sendModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="sendTitle">
      <button class="close" id="closeSend" aria-label="Close">×</button>
      <h2 id="sendTitle">Send files</h2>
      <div class="file-list" id="fileList"></div>
      <div class="progress-wrap hidden" id="progressWrap">
        <div class="progress-line"><span id="progressBar"></span></div>
        <div class="progress-text" id="progressText">Preparing upload…</div>
      </div>
      <button id="startUpload" class="primary">Create transfer key</button>
    </section>
  </div>

  <!-- ── File result modal ────────────────────────────────────────────── -->
  <div class="modal hidden" id="resultModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <section class="dialog result-dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <button class="close" id="closeResult" aria-label="Close">×</button>
      <h2 id="resultTitle">Your key</h2>
      <div class="key-big" id="resultKey">000000</div>
      <div class="expiry" id="resultExpiry"></div>
      <div class="enc-badge" aria-label="Encrypted">🔒 AES-256-GCM Encrypted</div>
      <button id="copyKey" class="primary">Copy key</button>
      <button id="cancelTransfer" class="secondary">Delete transfer</button>
      <div class="result-files" id="resultFiles"></div>
    </section>
  </div>

  <!-- ── Text compose modal ───────────────────────────────────────────── -->
  <div class="modal hidden" id="textModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="textTitle">
      <button class="close" id="closeText" aria-label="Close">×</button>
      <h2 id="textTitle">Send text</h2>
      <textarea id="textInput" class="text-compose" placeholder="Paste or type your text here…" maxlength="500000" aria-label="Text to send"></textarea>
      <div class="text-meta">
        <span id="textCharCount">0 chars</span>
        <span class="text-meta-limit">max 5,00,000 chars</span>
      </div>
      <div class="progress-wrap hidden" id="textProgressWrap">
        <div class="progress-text" id="textProgressText">Encrypting &amp; sending…</div>
      </div>
      <button id="startTextSend" class="primary">Create text key</button>
    </section>
  </div>

  <!-- ── Text result modal ─────────────────────────────────────────────── -->
  <div class="modal hidden" id="textResultModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <section class="dialog result-dialog" role="dialog" aria-modal="true" aria-labelledby="textResultTitle">
      <button class="close" id="closeTextResult" aria-label="Close">×</button>
      <h2 id="textResultTitle">Your text key</h2>
      <div class="key-big" id="textResultKey">000000</div>
      <div class="expiry" id="textResultExpiry"></div>
      <div class="enc-badge" aria-label="Encrypted">🔒 AES-256-GCM · Single-use</div>
      <button id="copyTextKey" class="primary">Copy key</button>
      <button id="cancelTextTransfer" class="secondary">Delete text</button>
    </section>
  </div>

  <!-- ── File receive modal ────────────────────────────────────────────── -->
  <div class="modal hidden" id="receiveModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="receiveTitle">
      <button class="close" id="closeReceive" aria-label="Close">×</button>
      <h2 id="receiveTitle">Receive files</h2>
      <div id="receiveBody"></div>
    </section>
  </div>

  <!-- ── Text receive modal ─────────────────────────────────────────────── -->
  <div class="modal hidden" id="textReceiveModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="textReceiveTitle">
      <button class="close" id="closeTextReceive" aria-label="Close">×</button>
      <h2 id="textReceiveTitle">Received text</h2>
      <div id="textReceiveBody"></div>
    </section>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
